openapi: 3.2.0
info:
  title: Bohrium Open 容器镜像 (bohrium-image) API
  description: 'Bohrium 平台对外 OpenAPI 的单一事实源（single source of truth）。


    本文档由仓库 `dptech-corp/bohrium-skills` 的 `docs/api/openapi.json` 维护，内容基于各 Skill（`zh//SKILL.md`）中记录的真实接口生成；Apifox 定时从本仓库抓取并同步到 https://open.bohrium.com 。


    鉴权：所有接口使用 `Authorization: Bearer `。业务返回通常为 `{code, data, message}` 信封，`code==0` 成功，`code==2000` 未授权。


    计费端点在 operation 上以 `x-bohrium-price` 扩展标注机器可读价格，并在 description 末尾追加人类可读的「计费」行。


    说明：`bohrium-database`（SDK/CLI）与 `bohrium-sandbox`（CLI）不直接暴露 REST 端点，故本文档未收录其路径。'
  version: 2.0.0
servers:
- url: https://open.bohrium.com
  description: Bohrium OpenAPI 正式环境
security:
- bearerAuth: []
tags:
- name: 容器镜像 (bohrium-image)
  description: 容器镜像管理 — 查询、拉取、创建、删除镜像。免费。镜像地址位于 registry.dp.tech / registry.bohrium.dp.tech。
paths:
  /openapi/v2/image/public/version/search:
    get:
      tags:
      - 容器镜像 (bohrium-image)
      summary: 搜索公开镜像版本
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      operationId: getOpenapiV2ImagePublicVersionSearch
      x-operation-id-source: derived
  /openapi/v2/image/public:
    get:
      tags:
      - 容器镜像 (bohrium-image)
      summary: 公开镜像分类
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      operationId: getOpenapiV2ImagePublic
      x-operation-id-source: derived
  /openapi/v2/image/public/{image_id}/version:
    get:
      tags:
      - 容器镜像 (bohrium-image)
      summary: 公开镜像版本
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      operationId: getOpenapiV2ImagePublicByImageIdVersion
      x-operation-id-source: derived
  /openapi/v2/image/private:
    post:
      tags:
      - 容器镜像 (bohrium-image)
      summary: 创建私有镜像（Dockerfile 构建）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                projectId:
                  type: string
                device:
                  type: string
                buildType:
                  type: string
                dockerfile:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      operationId: postOpenapiV2ImagePrivate
      x-operation-id-source: derived
    get:
      tags:
      - 容器镜像 (bohrium-image)
      summary: 私有镜像列表
      parameters:
      - name: device
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      operationId: getOpenapiV2ImagePrivate
      x-operation-id-source: derived
  /openapi/v2/image/private/{image_id}:
    get:
      tags:
      - 容器镜像 (bohrium-image)
      summary: 私有镜像详情
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      operationId: getOpenapiV2ImagePrivateByImageId
      x-operation-id-source: derived
    put:
      tags:
      - 容器镜像 (bohrium-image)
      summary: 更新镜像描述
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                desc:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      operationId: putOpenapiV2ImagePrivateByImageId
      x-operation-id-source: derived
  /openapi/v2/image/dockerfile/check:
    post:
      tags:
      - 容器镜像 (bohrium-image)
      summary: 校验 Dockerfile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dockerfile:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      operationId: postOpenapiV2ImageDockerfileCheck
      x-operation-id-source: derived
  /openapi/v2/image/last_used:
    get:
      tags:
      - 容器镜像 (bohrium-image)
      summary: 最近使用镜像
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      operationId: getOpenapiV2ImageLastUsed
      x-operation-id-source: derived
  /openapi/v2/image/{image_id}/share:
    post:
      tags:
      - 容器镜像 (bohrium-image)
      summary: 分享镜像
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      operationId: postOpenapiV2ImageByImageIdShare
      x-operation-id-source: derived
    delete:
      tags:
      - 容器镜像 (bohrium-image)
      summary: 取消分享
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
      - name: device
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      operationId: deleteOpenapiV2ImageByImageIdShare
      x-operation-id-source: derived
components:
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          description: 0 成功，2000 未授权
        message:
          type: string
        data:
          type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bohrium AccessKey，环境变量 BOHR_ACCESS_KEY，作为 Bearer token
