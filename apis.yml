aid: dp
name: DP Technology (Bohrium)
description: >-
  DP Technology (Deep Potential Technology, 深势科技) is a global pioneer of the "AI for
  Science" research paradigm, founded in 2018 with offices in Beijing, Shanghai, Shenzhen,
  and Yibin. Its Bohrium platform is a research cloud for microscale scientific computing
  and industrial design — compute jobs, development nodes, datasets, container images,
  projects, knowledge bases, large knowledge models, paper/patent/scholar search, PDF
  parsing, a scientific-tools library, and web search — all reachable through the Bohrium
  OpenAPI (Bearer AccessKey auth, base URL https://open.bohrium.com). DP Technology also
  founds and maintains the open-source DeepModeling molecular-simulation toolchain
  (DeePMD-kit, DP-GEN, dpdispatcher, dpdata) and ships a first-party Python SDK, agent SDK,
  CLI, and 17 official Agent Skills.
